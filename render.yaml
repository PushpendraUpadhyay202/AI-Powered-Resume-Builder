services:
  # 🔐 Auth Service
  - type: web
    name: resume-ai-auth
    env: docker
    dockerContext: ./AuthService
    dockerfilePath: ./AuthService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false

  # 📄 Resume Service
  - type: web
    name: resume-ai-resumes
    env: docker
    dockerContext: ./ResumeService
    dockerfilePath: ./ResumeService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key

  # 🧩 Section Service
  - type: web
    name: resume-ai-sections
    env: docker
    dockerContext: ./SectionService
    dockerfilePath: ./SectionService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key

  # 🎨 Template Service
  - type: web
    name: resume-ai-templates
    env: docker
    dockerContext: ./TemplateService
    dockerfilePath: ./TemplateService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key

  # 🤖 AI Service
  - type: web
    name: resume-ai-ai
    env: docker
    dockerContext: ./AIService
    dockerfilePath: ./AIService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key

  # 📤 Export Service
  - type: web
    name: resume-ai-export
    env: docker
    dockerContext: ./ExportService
    dockerfilePath: ./ExportService/Dockerfile
    plan: free
    envVars:
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key
      - key: Services__ResumeService
        fromService:
          name: resume-ai-resumes
          type: web
          property: host
      - key: Services__TemplateService
        fromService:
          name: resume-ai-templates
          type: web
          property: host
      - key: Services__SectionService
        fromService:
          name: resume-ai-sections
          type: web
          property: host
      - key: Services__AuthService
        fromService:
          name: resume-ai-auth
          type: web
          property: host

  # 🚦 Payment Service
  - type: web
    name: resume-ai-payment
    env: docker
    dockerContext: ./PaymentService
    dockerfilePath: ./PaymentService/Dockerfile
    plan: free
    envVars:
      - key: Jwt__Key
        fromService:
          name: resume-ai-auth
          type: web
          envVarKey: Jwt__Key

  # 🌐 Frontend (Angular Docker Service)
  - type: web
    name: resume-ai-ui
    env: docker
    dockerContext: ./resumeai-angular
    dockerfilePath: ./resumeai-angular/Dockerfile
    plan: free
