services:
  # 🔐 Auth Service
  - type: web
    name: resume-ai-auth
    env: docker
    dockerContext: ./AuthService
    dockerfilePath: ./AuthService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI
      - key: Authentication__Google__ClientId
        sync: false
      - key: Authentication__Google__ClientSecret
        sync: false

  # 📄 Resume Service
  - type: web
    name: resume-ai-resumes
    env: docker
    dockerContext: ./ResumeService
    dockerfilePath: ./ResumeService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Services__AuthService
        value: https://resume-ai-auth-f9dh.onrender.com
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 🧩 Section Service
  - type: web
    name: resume-ai-sections
    env: docker
    dockerContext: ./SectionService
    dockerfilePath: ./SectionService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 🎨 Template Service
  - type: web
    name: resume-ai-templates
    env: docker
    dockerContext: ./TemplateService
    dockerfilePath: ./TemplateService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 🤖 AI Service
  - type: web
    name: resume-ai-ai
    env: docker
    dockerContext: ./AIService
    dockerfilePath: ./AIService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Groq__ApiKey
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 📤 Export Service
  - type: web
    name: resume-ai-export
    env: docker
    dockerContext: ./ExportService
    dockerfilePath: ./ExportService/Dockerfile
    plan: free
    envVars:
      - key: Jwt__Key
        sync: false
      - key: Services__ResumeService
        value: https://resume-ai-resumes-rzy2.onrender.com
      - key: Services__TemplateService
        value: https://resume-ai-templates-fbj8.onrender.com
      - key: Services__SectionService
        value: https://resume-ai-sections-tt5s.onrender.com
      - key: Services__AuthService
        value: https://resume-ai-auth-f9dh.onrender.com
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 🚦 Payment Service
  - type: web
    name: resume-ai-payment
    env: docker
    dockerContext: ./PaymentService
    dockerfilePath: ./PaymentService/Dockerfile
    plan: free
    envVars:
      - key: Jwt__Key
        sync: false
      - key: Razorpay__KeyId
        value: rzp_test_Sp7sHJXRWO4Jm1
      - key: Razorpay__KeySecret
        value: u446eUrEP91ugBeL83EZnsCb
      - key: Services__AuthService
        value: https://resume-ai-auth-f9dh.onrender.com
      - key: Jwt__Issuer
        value: ResumeAI
      - key: Jwt__Audience
        value: ResumeAI

  # 🌐 Frontend (Angular Docker Service)
  - type: web
    name: resume-ai-ui
    env: docker
    dockerContext: ./resumeai-angular
    dockerfilePath: ./resumeai-angular/Dockerfile
    plan: free
